name: Publish Python Package to PyPI

on:
  release:
    types: [created]
  workflow_run:
    workflows: ["Bump Version"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.ref == 'refs/heads/main') }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        ref: ${{ github.event.release.tag_name || 'main' }}
    
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.14'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install uv twine toml
    
    - name: Build package
      run: |
        rm -rf dist/
        uv build --no-sources
        
    - name: Check distribution with twine
      run: |
        twine check dist/*
        
    - name: Publish to PyPI
      env:
        PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/* -u __token__ -p $PYPI_API_TOKEN
    
    - name: Show server.json before publish
      run: |
        echo "server.json (pre-publish):"
        cat server.json
        echo
        python - << 'PY'
        import json
        data = json.load(open('server.json'))
        print('packages[0] keys:', list(data.get('packages', [{}])[0].keys()))
        PY

    - name: Install MCP Publisher (latest)
      run: |
        set -euo pipefail
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)
        case "$ARCH" in x86_64) ARCH=amd64;; aarch64) ARCH=arm64;; *) echo "Unsupported arch: $ARCH"; exit 1;; esac
        URL="https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz"
        echo "Downloading: $URL"
        curl -fsSL "$URL" | tar xz mcp-publisher
        chmod +x mcp-publisher
        ./mcp-publisher --help || true

    - name: Login to MCP Registry (OIDC)
      run: ./mcp-publisher login github-oidc

    - name: Publish to MCP Registry
      run: ./mcp-publisher publish
        
    - name: Extract package version
      id: get_version
      run: |
        PACKAGE_VERSION=$(python -c "import toml; print(toml.load('pyproject.toml')['project']['version'])")
        echo "version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
    
    - name: Notify Slack about PyPI release
      id: slack
      uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
      with:
        method: chat.postMessage
        token: ${{ secrets.SLACK_BOT_TOKEN }}
        payload-templated: true
        payload: |
          {
            "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
            "text": "New Release Published to PyPI: lineai-mcp-server v${{ steps.get_version.outputs.version }}",
            "blocks": [
              {
                "type": "section",
                "text": {"type": "mrkdwn", "text": ":rocket: *New Release Published to PyPI!*"}
              },
              {
                "type": "section",
                "text": {"type": "mrkdwn", "text": "*Package:* lineai-mcp-server v${{ steps.get_version.outputs.version }}\n*Published by:* ${{ github.actor }}"}
              },
              {
                "type": "section",
                "text": {"type": "mrkdwn", "text": ":link: <https://pypi.org/project/lineai-mcp-server/${{ steps.get_version.outputs.version }}|View on PyPI>"}
              }
            ]
          }