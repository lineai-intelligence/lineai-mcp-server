name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13, 3.14]

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      env:
        PIP_PROGRESS_BAR: off
      run: |
        python -m pip install --upgrade pip -q
        python -m pip install uv -q
        # The project has no [dev] extra (dev tools live in [dependency-groups]);
        # install the package itself and the dev group explicitly.
        uv pip install --system -e . --group dev --quiet
        python -m pip install flake8 -q
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings (quiet: only violations, no per-file stats)
        flake8 . --count --exit-zero --max-complexity=10 --quiet
    - name: Test with unittest
      run: |
        python -m unittest discover -s test -p "unit*.py"